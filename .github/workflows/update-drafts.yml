name: Update draft reviews

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build current Draftsim review list
        run: node scripts/update-drafts.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- drafts.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts.json
          git commit -m "Update draft reviews"
          git push
