<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft ReViewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css" />
  <link rel="stylesheet" href="styles.css?v=nav-swap-1" />
</head>
<body>

  <main id="app" tabindex="-1">
    <section class="controls" aria-label="MTG-Set- oder Cube-Auswahl">
      <div class="brand-logo">
        <img src="assets/draft-reviewer-logo.svg" alt="Draft ReViewer" />
      </div>

      <div class="source-picker">
        <label class="mode-picker"><span class="sr-only">Format auswählen</span>
          <select id="sourceMode"><option value="draft">MTG Set</option><option value="cube">Cube</option></select>
        </label>
        <label id="draftPicker" class="draft-picker">
          <span class="sr-only">MTG Set auswählen</span>
          <select id="draftSelect"></select>
        </label>
        <div id="cubePicker" class="cube-picker" hidden>
          <label class="sr-only" for="cubeSearch">Unter den Top 50 CubeCobra-Cubes suchen</label>
          <input id="cubeSearch" type="search" role="combobox" placeholder="Top-50-Cube suchen …" autocomplete="off" spellcheck="false"
            aria-autocomplete="list" aria-expanded="false" aria-controls="cubeSuggestions" aria-describedby="cubeSearchHint" />
          <div id="cubeSuggestionPanel" class="cube-suggestion-panel" hidden>
            <ul id="cubeSuggestions" role="listbox" aria-label="Cube-Vorschläge"></ul>
            <p id="cubeSearchHint" class="cube-search-hint" role="status"></p>
          </div>
        </div>
      </div>

      <button id="loadBtn" type="button">Laden</button>
      <button id="checkLatestBtn" class="secondary" type="button">Neue Sets suchen</button>
    </section>

    <section id="status" class="status" aria-live="polite" hidden></section>

    <section id="progress" class="progress" aria-label="Ladefortschritt" hidden>
      <div class="progress-row">
        <span id="progressLabel">Bereite Laden vor...</span>
        <span id="progressPercent">0%</span>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="progressTime" class="progress-time"></div>
    </section>

    <section id="untappedMeta" class="untapped-meta" aria-label="Untapped Meta" aria-live="polite" hidden>
      <ol id="untappedMetaList" class="untapped-meta-list"></ol>
      <a id="untappedMetaLink" class="untapped-meta-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
        Tierlist öffnen <span aria-hidden="true">↗</span>
      </a>
    </section>

    <section id="results" class="results"></section>
  </main>

  <aside id="toc" class="toc" hidden>
    <button id="tocToggle" class="toc-toggle" type="button" aria-expanded="true">
      Archetypen
    </button>
    <nav id="tocList" class="toc-list" aria-label="Archetypen Navigation"></nav>
  </aside>
  <button id="backToTop" class="back-to-top" type="button" aria-label="Nach oben" title="Nach oben" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 12 6-6 6 6M12 6v13" /></svg>
  </button>

  <template id="cardTemplate">
    <article class="card">
      <div class="image-wrap">
        <div class="missing-img">Bild laedt...</div>
      </div>

      <div class="card-body">
        <div class="card-topline"></div>
        <h3></h3>
        <div class="rating"></div>
        <p class="review"></p>
      </div>
    </article>
  </template>

  <dialog id="metaCardsDialog" class="meta-cards-dialog" aria-labelledby="metaCardsTitle" aria-describedby="metaCardsDescription">
    <div class="meta-cards-header">
      <div><h2 id="metaCardsTitle"></h2><p id="metaCardsDescription"></p></div>
      <button id="metaCardsClose" class="secondary" type="button" aria-label="Kartenübersicht schließen">✕</button>
    </div>
    <ol id="metaCardsGrid" class="meta-cards-grid"></ol>
    <a id="metaCardsSource" class="meta-cards-source" target="_blank" rel="noopener noreferrer">Trophy Decks auf Untapped öffnen ↗</a>
  </dialog>
  <script src="cube-data.js?v=cube-winrates-1"></script>
  <script src="set-catalog.js?v=sets-prerelease-1"></script>
  <script src="app.js?v=untapped-cards-1"></script>
</body>
</html>
